# ==============================================
# Configuración General Optimizada para Vim
# ==============================================

# Actualizar a terminal más moderno (verificar compatibilidad con tu terminal)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty*:Tc"
set -ga terminal-overrides ",xterm-kitty:RGB"
set -ga terminal-overrides ",*256col*:RGB"


set -sa terminal-features ',xterm-256color:RGB'

# Optimizaciones de rendimiento específicas para Vim
set -sg escape-time 0                         # Crucial para Vim (modo normal)
set -g focus-events on                        # Necesario para 'autoread' en Vim
set -g history-limit 500000                   # Buffer grande para búsquedas
set -g status-interval 2                      # Actualización rápida para plugins de Vim
set -g set-titles on
set -g monitor-activity off
set -g visual-activity off

# Numeración consistente con Vim
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on

# ==============================================
# Atajos de Teclado Estilo Vim
# ==============================================

# Prefijo principal
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Recarga de configuración
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Splits al estilo Vim
bind s split-window -v -c "#{pane_current_path}"    # Similar a :split
bind v split-window -h -c "#{pane_current_path}"    # Similar a :vsplit
bind c new-window -c "#{pane_current_path}"         # Nuevo buffer
bind q confirm-before -p "kill-pane #P? (y/n)" kill-pane  # Similar a :q
bind Q confirm-before -p "kill-window #W? (y/n)" kill-window  # Similar a :qa

# Navegación Vim entre paneles
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Smart pane switching with awareness of Vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# Redimensionar paneles estilo Vim
bind -r H resize-pane -L 2       # Similar a <C-w><
bind -r J resize-pane -D 2       # Similar a <C-w>-
bind -r K resize-pane -U 2       # Similar a <C-w>+
bind -r L resize-pane -R 2       # Similar a <C-w>>

# Navegación rápida entre ventanas (buffers)
bind -n M-h previous-window      # Similar a :bp
bind -n M-l next-window         # Similar a :bn
bind -n M-1 select-window -t 1  # Similar a :b1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# ==============================================
# Modo Copia Vim
# ==============================================

# Modo vi para copiar
set-window-option -g mode-keys vi

# Keybindings estilo Vim
bind -T copy-mode-vi v send -X begin-selection     # Empezar selección
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"  # Yank
bind -T copy-mode-vi r send -X rectangle-toggle    # Selección de bloque
bind -T copy-mode-vi V send -X select-line        # Seleccionar línea
bind P paste-buffer                               # Pegar (como p en vim)

# Integración con el sistema de clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# ==============================================
# Mouse y Scroll
# ==============================================

set -g mouse on
# Scroll suave compatible con Vim
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" \
    "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# ==============================================
# Tema y Estilo Visual (Tokyo Night)
# ==============================================

# Configuración de colores para mejor visibilidad con Vim
set -g @tokyo-night-tmux_window_id_style digital
set -g @tokyo-night-tmux_pane_id_style hsquare
set -g @tokyo-night-tmux_zoom_id_style dsquare
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_date_format "| %Y-%m-%d"
set -g @tokyo-night-tmux_time_format "| %H:%M"
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format "#{b:pane_current_path}"

# Personalización de la barra de estado
set -g status-position top
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 100

# ==============================================
# Plugins
# ==============================================

set -g @plugin 'tmux-plugins/tpm'                   # Gestor de plugins
set -g @plugin 'tmux-plugins/tmux-sensible'         # Configuraciones base
set -g @plugin 'christoomey/vim-tmux-navigator'     # Navegación vim/tmux seamless
set -g @plugin 'tmux-plugins/tmux-yank'            # Mejor integración con clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'       # Persistencia de sesiones
set -g @plugin 'tmux-plugins/tmux-continuum'       # Auto-guardado
set -g @plugin 'janoamaral/tokyo-night-tmux'       # Tema
set -g @plugin 'tmux-plugins/tmux-cpu'             # Monitor de CPU
# set -g @plugin 'tmux-plugins/tmux-battery'         # Monitor de batería

# Configuración específica para Vim
set -g @resurrect-strategy-vim 'session'           # Restaurar sesiones de Vim
set -g @resurrect-strategy-nvim 'session'          # Restaurar sesiones de Neovim
set -g @resurrect-capture-pane-contents 'off'      # Restaurar contenido de paneles
set -g @resurrect-processes 'vim nvim'             # Restaurar procesos de Vim
set -g @continuum-restore 'off'
set -g @continuum-save-interval '5'
set -g @resurrect-dir '~/.tmux/resurrect'

# Inicialización de TPM (mantener al final)
run '~/.tmux/plugins/tpm/tpm'
