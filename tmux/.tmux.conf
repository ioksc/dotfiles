# Configuración general y rendimiento
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,*:Tc"  # Unificada para true color
set -sg escape-time 0                                # Respuesta rápida para Vim
set -g history-limit 10000                           # Reducido para rendimiento
set -g status-interval 5                             # Menos frecuente para menos carga
set -g display-time 1000                             # Duración de mensajes
set -g set-titles on                                 # Títulos automáticos
set -g base-index 1                                  # Índices desde 1
setw -g pane-base-index 1                            # Índices de paneles desde 1
set -g renumber-windows on                           # Renumerar ventanas
set -g focus-events on                               # Necesario para Vim
set -g monitor-activity off                          # Desactivar monitoreo
set -g visual-activity off                           # Sin notificaciones visuales
set -g allow-rename off                              # Evitar renombrado automático

# set-hook -g session-created "send-keys 'clear' Enter"
# Prefijo y atajos de teclado
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display "🔄 Config recargado"

# Divisiones de paneles
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Ventanas y paneles
bind c new-window -c "#{pane_current_path}"
bind C command-prompt -p "Nombre ventana:" "new-window -n '%%' -c '#{pane_current_path}'"
bind x kill-pane
bind X kill-window
bind q confirm-before -p "¿Cerrar panel #P? (y/n)" kill-pane
bind Q confirm-before -p "¿Cerrar ventana #W? (y/n)" kill-window

# Navegación de paneles (estilo Vim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-window

# Redimensionar y maximizar
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
bind m resize-pane -Z

# Navegación de ventanas
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1
bind -n C-S-Left swap-window -t -1 \; select-window -t -1
bind -n C-S-Right swap-window -t +1 \; select-window -t +1

# Sesiones
bind -n C-M-s choose-session                         # Ctrl+Alt+S para elegir sesión
bind C-s run-shell "tmux-resurrect save" \; display "💾 Sesión guardada"  # prefix + Ctrl+S para guardar
bind d detach-client \; display "🚪 Sesión desconectada"  # prefix + d para salir sin eliminar
bind S command-prompt -p "Nueva sesión:" "new-session -s '%%'"
bind R run-shell "tmux-resurrect restore" \; display "🔄 Sesión restaurada"

# Comandos personalizados
bind e setw synchronize-panes
bind M run-shell "tmux split-window -v -c '#{pane_current_path}' 'make; read'"
bind H command-prompt -p "man:" "new-window -n 'man %%' 'man %%'"
bind D run-shell "tmux split-window -h -c '#{pane_current_path}' \; select-pane -t 0 \; resize-pane -R 20 \; split-window -v -c '#{pane_current_path}' \; select-pane -t 0"
bind B run-shell "tmux split-window -v -c '#{pane_current_path}' \; select-pane -t 0 \; split-window -h -c '#{pane_current_path}' \; select-pane -t 0"

# Limpieza de terminal
bind -n C-k send-keys 'C-l'                          # Ctrl+K para limpiar pantalla

# Modo copia estilo Vim
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel -ib"
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi w send -X next-word
bind -T copy-mode-vi b send -X previous-word
bind -T copy-mode-vi e send -X next-word-end
bind -T copy-mode-vi g send -X top-line
bind -T copy-mode-vi G send -X bottom-line
bind -T copy-mode-vi 0 send -X start-of-line
bind -T copy-mode-vi $ send -X end-of-line
bind -T copy-mode-vi / command-prompt -p "Buscar abajo:" "send -X search-forward '%%'"
bind -T copy-mode-vi ? command-prompt -p "Buscar arriba:" "send -X search-backward '%%'"
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi N send -X search-reverse
bind p paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xsel -ib"
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send -X select-word \; run-shell "sleep 0.1s" \; send -X copy-pipe-and-cancel "xsel -ib"

# Soporte para ratón
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'dracula/tmux'

# Configuración de plugins
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'vim'
set -g @resurrect-save-shell-history 'on'
set -g @resurrect-dir '~/.tmux/resurrect'

set -g @dracula-plugins "ram-usage"
set -g @dracula-show-left-icon "Sesión:#S"
set -g @dracula-border-contrast true
set -g @dracula-show-empty-plugins false
set -g @dracula-show-flags true
set -g @dracula-show-powerline true
set -g @dracula-transparent-powerline-bg true
set -g @dracula-left-icon-padding 1

# Inicializar TPM
run '~/.tmux/plugins/tpm/tpm'
