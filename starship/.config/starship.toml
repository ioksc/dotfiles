format = """
$hostname\
$directory\
$git_branch$git_status\
$docker_context\
$python$nodejs$golang$rust\
$shell\
$battery\
$cmd_duration\
$line_break\
$character"""

add_newline = false
palette = 'onedark'

# ░░░ DIRECTORIO
[directory]
style = 'bold fg:cyan'
format = '[󰣇 $path]($style) '
truncation_length = 3
truncation_symbol = '…/'

[directory.substitutions]
'Documentos'  = '󰈙 '
'Downloads'  = ' '
'Descargas'  = ' '
'Music'      = ' '
'Pictures'   = ' '
'Workspace'  = ' '

# ░░░ GIT
[git_branch]
symbol = ' '
style = 'fg:green'
format = '[$symbol$branch]($style) '

[git_status]
style = 'fg:red'
format = '([$all_status$ahead_behind]($style)) '

# ░░░ PYTHON
[python]
symbol = ' '
style = 'fg:yellow'
format = '[${symbol}${version} ($virtualenv)]($style) '
pyenv_version_name = true

# ░░░ NODE
[nodejs]
symbol = ' '
style = 'fg:green'
format = '[${symbol}${version}]($style) '

# ░░░ GOLANG
[golang]
symbol = ' '
style = 'fg:cyan'
format = '[${symbol}${version}]($style) '

# ░░░ RUST
[rust]
symbol = ' '
style = 'fg:red'
format = '[${symbol}${version}]($style) '

# ░░░ DOCKER
[docker_context]
disabled = true
symbol = ' '
style = 'fg:blue'
format = '[in $symbol$context]($style) '
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']


# ░░░ SHELL
[shell]
disabled = true
style = 'fg:purple'
format = '[  $indicator]($style) '

# ░░░ HOSTNAME
[hostname]
ssh_only = true
style = 'fg:pink'
format = '[󰒋 $hostname]($style) '



# ░░░ DURACIÓN
[cmd_duration]
min_time = 300
style = 'fg:gray'
format = '⏱ [$duration]($style) '


# ░░░ HORA
[time]
disabled = false
time_format = '%H:%M'
style = 'fg:gray'
format = ' [$time]($style) '

# ░░░ CARÁCTER
[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'


[palettes.onedark]
fg         = '#abb2bf'
bg         = '#282c34'
black      = '#1e222a'
red        = '#e06c75'
green      = '#98c379'
yellow     = '#e5c07b'
blue       = '#61afef'
magenta    = '#c678dd'
cyan       = '#56b6c2'
white      = '#dcdfe4'
gray       = '#5c6370'
orange     = '#d19a66'

