[general]
import = [
  "~/dotfiles/alacritty/.config/alacritty/cyberpunk.toml",
]
live_config_reload = true

[window]
opacity = 0.96
padding ={ x = 3, y = 3 }
dynamic_padding = true
decorations = "Buttonless"

[font]
normal = {family = "MonaspiceRn Nerd Font", style = "Regular"}
bold   = {family = "JetBrainsMonoNL NF", style = "Bold"}
size   = 13

[mouse]
hide_when_typing = true

[scrolling]
history = 50000
multiplier = 4

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Beam", blinking = "Always" }
thickness = 0.46

[env]
TERM = "xterm-256color"
