[colors]
background        =  #282A36
foreground        =  #F8F8F2
red               =  #FF5555
bloodofmyenemies  =  #A60B00
green             =  #50FA7B
yellow            =  #F1FA8C
blue              =  #6272A4
purple            =  #BD93F9
cyan              =  #8BE9FD
orange            =  #FF5555
pink              =  #FF79C6
grey              =  #8FA6A1

[bar/top]
monitor = ${env:MONITOR:}

width  = 100%
height = 23
radius = 3
fixed-center = true

background = ${colors.background}
foreground = ${colors.grey}

line-size  = 2
line-color = ${colors.foreground}

border-size  = 0
border-color = ${colors.background}

padding-left  = 1
padding-right = 1

module-margin-left  = 0
module-margin-right = 0

font-0 = "CaskaydiaCove Nerd Font:size=12;3"
font-1 = "Font Awesome 5 Free:size=12;3"
font-2 = "Font Awesome 5 Free Solid:size=12;3"
font-3 = "Font Awesome 5 Brands:size=12;3"
font-4 = "Font Awesome 7 Free:size=12;3"
font-5 = "Font Awesome 7 Free Solid:size=12;3"
font-6 = "Font Awesome 7 Brands:size=12;3"

modules-left   = archlinux i3
modules-center = time date
modules-right  = cpu_temp nightmode audio systray logout poweroff

cursor-click  = pointer
cursor-scroll = ns-resize

[module/i3]
type            =  internal/i3
pin-workspaces  =  true
enable-click    =  true
enable-scroll   =  true
index-sort      =  false
fuzzy-match     =  true

ws-icon-0        =  1;◉
ws-icon-1        =  2;◉
ws-icon-2        =  3;◉
ws-icon-3        =  4;◉
ws-icon-4        =  5;◉
ws-icon-5        =  6;◉
ws-icon-default  =  ◯

label-focused             =  %icon%
label-focused-foreground  =  ${colors.green}
label-focused-padding     =  2
label-unfocused           =  %icon%
label-unfocused-padding   =  2
label-visible             =  %icon%
label-visible-padding     =  2
label-urgent              =  %icon%
label-urgent-foreground   =  ${colors.red}
label-urgent-padding      =  2
ipc-enabled               =  true

[module/time]
type = internal/date
interval = 1.0
time = %H:%M:%S
label =  %time%
label-padding = 1

[module/date]
type = internal/date
interval = 1.0
date = %Y-%m-%d
label =  %date%
label-padding = 1

[module/audio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume =  %percentage%%
label-volume-foreground = ${colors.gray}
label-volume-padding = 1
format-muted = <label-muted>
label-muted =  Muted
label-muted-foreground = ${colors.red}
label-muted-padding = 1

[module/network]
type = internal/network
interface = eno1
format-connected = <label-connected>
label-connected =   %local_ip%
label-connected-foreground = ${colors.green}
label-connected-padding = 1

format-disconnected = <label-disconnected>
label-disconnected =  Disconnected
label-disconnected-foreground = ${colors.red}
label-disconnected-padding = 1

[module/battery]
type = internal/battery
full-at = 98
battery = BAT0
adapter = AC

format-charging = <animation-charging> <label-charging>
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%

format-full = <ramp-capacity> Full

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-1-foreground = ${colors.orange}
ramp-capacity-2-foreground = ${colors.yellow}
ramp-capacity-3-foreground = ${colors.green}
ramp-capacity-4-foreground = ${colors.green}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

label-padding = 1

[module/lock]
type = custom/text
format = <label>
label = 
label-foreground = ${colors.foreground}
label-padding = 2
click-left = i3lock-fancy -f Roboto-Regular -t ""

[module/headphones]
type = custom/script
exec = ~/.config/polybar/scripts/headphone_monitor.sh
tail = true
label-padding = 2
label-background = ${colors.blue}
label-foreground = ${colors.foreground}

[module/archlinux]
type = custom/text
format = <label>
label = 
label-foreground = ${colors.green}
label-padding = 1
click-left = rofi -theme $HOME/raycast_modern.rasi -show drun

[module/logout]
type = custom/text
format = <label>
label = 
label-foreground = ${colors.foreground}
label-padding = 1
click-left = i3-msg exit

[module/poweroff]
type = custom/text
format = <label>
label = 
label-foreground = ${colors.red}
label-padding = 1
click-left = poweroff

[module/systray]
type = internal/tray
tray-spacing = 4
tray-size = 65%
format-margin = 1
tray-background = ${colors.background}

[module/updates]
type      =  custom/script
exec      =  ~/.config/polybar/scripts/arch-updates.sh
interval  =  1800
format    =  <label>
label     =  %output%

[module/nightmode]
type              =  custom/script
exec              =  $HOME/dotfiles/scripts/nightmode.sh
interval          =  2
format            =  <label>
label-padding     =  1
label             =  %output%
label-foreground  =  ${colors.gray}
click-left        =  $HOME/dotfiles/scripts/nightmode.sh  toggle

[module/cpu_temp]
type = custom/script
exec = sensors | awk '/Core [0-9]+/ {print $3}' | sort -nr | head -1 | sed 's/+//; s/°C//'
interval = 5
format = <label>
label =  %output%°C
label-foreground = ${colors.gray}

[settings]
screenchange-reload = true



[global/wm]
margin-top     =  7
margin-bottom  =  7
