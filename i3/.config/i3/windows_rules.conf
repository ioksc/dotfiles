# Floating rules
for_window [class="Nm-connection-editor"] floating enable
for_window [class="Blueman-manager"] floating enable
for_window [class="burp-StartBurp"] floating enable
for_window [class="qalculate-qt"] floating enable
for_window [class="Lxappearance"] floating enable
for_window [class="KeePassXC"] floating enable
for_window [class="Nm-applet"] floating enable
for_window [class="Settings"] floating enable
for_window [class="Nitrogen"] floating enable
for_window [class="GParted"] floating enable
for_window [class="Session"] floating enable
for_window [class="Gpick"] floating enable
for_window [class="Flet"] floating enable
for_window [class="Spek"] floating enable

for_window [class='firefox' instance='Places'] floating enable
for_window [window_role="^(pop-up|task_dialog)$"] floating enable

# No borders
for_window [class="^(firefox|Chromium|anytype)$"] border none

# Windows sticky rules
for_window [class="firefox" instance="Toolkit"] sticky enable
for_window [class="zen"     instance="Toolkit"] stycky enable
for_window [class="guvcview-qt"] sticky enable

# Focus on the urgent window
for_window [urgent=latest] focus

# ----- Custom -----
for_window [class="float_custom"] floating enable, resize set 620 450, border pixel 2 move position center
